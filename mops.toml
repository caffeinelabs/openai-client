[toolchain]
moc = "1.6.0"

[package]
name = "openai-client"
version = "0.3.0"
description = "Generated Motoko client for OpenAI API"
repository = "https://github.com/caffeinelabs/skills"
license = "Apache-2.0"
files = ["src/Config.mo", "src/Apis/**/*.mo", "src/Models/**/*.mo"]

[dependencies]
core = "2.6.0"
serde-core = "0.2.1" # ggreif/serde fork (branch `core`), DE-BASED: skip_null_fields (NatLabs/serde#44) + Map<K,V> cycle fix + \u-escape/surrogate-pair/RFC 8259 §7 JSON escaping. A build depending on it resolves core + sha2 ONLY — no base, no buffer, no second core: 0.2.1 vendors buffer/cbor/xtended-numbers/ByteUtils behind relative imports (verified with a consumer probe). base is dev-only upstream. Supersedes 0.2.0, whose residual base@0.16 came via buffer@0.1.0 (edjCase/motoko_buffer#1, still unanswered).
